<div class="container py-5 my-4">
  <div class="row justify-content-center">
    <div class="col-md-7 col-lg-5">
      <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
        <div class="bg-dark text-white p-4 text-center border-bottom border-warning border-3">
          <i class="bi bi-shield-lock-fill display-5 text-warning mb-2 d-block"></i>
          <h3 class="font-serif fw-bold text-light mb-1">Heritage Portal Sign In</h3>
          <p class="text-secondary small mb-0">Role-Based Access for Visitors & Administrators</p>
        </div>

        <div class="card-body p-4 p-md-5 bg-white">
          <!-- Demo Quick-Fill Buttons -->
          <div class="mb-4 p-3 bg-light rounded-3 border">
            <div class="small fw-bold text-muted mb-2 text-uppercase letter-spacing-1">Quick Demo Accounts:</div>
            <div class="d-flex gap-2">
              <button type="button" class="btn btn-sm btn-outline-warning text-dark flex-fill fw-semibold" (click)="fillAdmin()">
                <i class="bi bi-person-fill-gear me-1"></i> Admin Demo
              </button>
              <button type="button" class="btn btn-sm btn-outline-primary flex-fill fw-semibold" (click)="fillVisitor()">
                <i class="bi bi-person-check-fill me-1"></i> Visitor Demo
              </button>
            </div>
            <div class="small text-muted mt-2 font-monospace">
              Admin: admin / admin123 | Visitor: visitor1 / visitor123
            </div>
          </div>

          <!-- Error Alert -->
          <div *ngIf="errorMessage" class="alert alert-danger py-2 px-3 small rounded-3 mb-3 d-flex align-items-center gap-2">
            <i class="bi bi-exclamation-triangle-fill fs-5 text-danger"></i>
            <div>{{ errorMessage }}</div>
          </div>

          <form (ngSubmit)="onSubmit()">
            <div class="mb-3">
              <label class="form-label small fw-semibold text-dark">Username</label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                <input type="text"
                       class="form-control"
                       placeholder="Enter username"
                       [(ngModel)]="credentials.username"
                       name="username"
                       required>
              </div>
            </div>

            <div class="mb-4">
              <label class="form-label small fw-semibold text-dark">Password</label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-key"></i></span>
                <input type="password"
                       class="form-control"
                       placeholder="Enter password"
                       [(ngModel)]="credentials.password"
                       name="password"
                       required>
              </div>
            </div>

            <button type="submit"
                    class="btn btn-heritage-primary w-100 py-2 fw-semibold shadow-sm mb-3"
                    [disabled]="loading">
              <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
              <i *ngIf="!loading" class="bi bi-box-arrow-in-right me-2"></i> Sign In
            </button>

            <div class="text-center pt-2 border-top">
              <span class="text-muted small">New visitor? </span>
              <a routerLink="/register" class="text-primary fw-semibold small text-decoration-none">
                <i class="bi bi-person-plus-fill me-1"></i>Create a Visitor Account
              </a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
