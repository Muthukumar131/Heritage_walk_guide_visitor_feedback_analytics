# ==============================================================
# Heritage Walk Guide Backend Configuration
# ==============================================================

server.port=8080
spring.application.name=heritage-walk-backend

# --------------------------------------------------------------
# 1. ACTIVE DATABASE: Virtual In-Memory Database (Runs immediately without MySQL Server)
# --------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:heritage_walk_db;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# Enable H2 Web Console to inspect database at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --------------------------------------------------------------
# 2. MYSQL DATABASE SETUP (Uncomment below once MySQL Server is installed)
# --------------------------------------------------------------
# spring.datasource.url=jdbc:mysql://localhost:3306/heritage_walk_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=root
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# spring.jpa.hibernate.ddl-auto=update

# --------------------------------------------------------------
# Performance & Speed Optimizations
# --------------------------------------------------------------
# 1. Enable GZIP response compression (reduces JSON & asset payload by ~75%)
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024

# 2. HikariCP Connection Pool optimization (fast acquisition, low latency)
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

# 3. HTTP Static Resource Caching (browser caches Angular JS/CSS/Fonts for instant reloads)
spring.web.resources.cache.cachecontrol.max-age=3600
spring.web.resources.chain.cache=true

# --------------------------------------------------------------
# General JPA & Jackson Settings
# --------------------------------------------------------------
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jackson.serialization.write-dates-as-timestamps=false

# --------------------------------------------------------------
# Logging
# --------------------------------------------------------------
logging.level.com.heritagewalk=INFO
logging.level.org.springframework.web=INFO
